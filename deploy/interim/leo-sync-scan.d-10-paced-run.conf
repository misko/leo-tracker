# Paced 12-hour run, 2026-08-14.
#
# Unthrottled this collector writes ~186 GB/h once each sweep's corpus copies
# are counted, and the share has 1.4 TB free -- so a 12 h run at the historical
# 478 sweeps/h would need ~2.2 TB and fill it. What the run is actually for is
# coverage across the clock: every figure in the detector report rests on a
# contiguous 00-06Z block of a single day, which no amount of extra scoring
# fixes. A 20 s period buys the full 12 h span for ~0.9 TB.
#
# Remove this drop-in to restore the original continuous behaviour.
[Service]
Environment=SYNC_SWEEP_PERIOD_S=20
Environment=SYNC_MIN_FREE_BYTES=250000000000
Environment=SYNC_FREE_CHECK=/mnt/qnap01/mouse9911
# 1.25 MS/s is below the AD9361's bare 2.083 MS/s floor and was rejected on
# every draw after the radios were re-plugged, which cleared the FIR that had
# been making it possible. Nine arms that work beat twelve where a quarter die.
Environment=SYNC_SKIP_RATES_HZ=1250000
