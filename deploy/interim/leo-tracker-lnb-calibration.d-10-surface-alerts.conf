# The command returns 1 on purpose when the mismatch has moved -- its own
# comment says "a moved cable earns a non-zero exit so a timer surfaces it" --
# and the unit then declared 1 a success, so the one signal it was built to
# raise arrived as a green status. The live artifact has alerts: [] across a
# 434,408 -> 602,869 Hz move, so nothing has been surfacing.
#
# Emptying the list first, because SuccessExitStatus= with no argument resets
# it; listing only 0 would otherwise append rather than replace.
[Service]
SuccessExitStatus=
SuccessExitStatus=0
