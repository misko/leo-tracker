[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leo-tracker"
version = "0.1.0"
description = "Test-driven LEO pass prediction and Doppler sensing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "scipy>=1.12",
  "sgp4>=2.24",
]

[project.scripts]
leo-orbit = "leo_tracker.orbit.cli:main"
leo-radio = "leo_tracker.radio.cli:main"
leo-report = "leo_tracker.report:main"
leo-gps = "leo_tracker.gps.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]
radio = [
  "zarr>=2.18,<3",
]
hardware = [
    "cmake>=4.4.0",
    "pyadi-iio>=0.0.21",
    "tqdm>=4.70.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/leo_tracker"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: requires attached radio hardware",
  "recorded: requires the local frozen observation artifacts",
]
